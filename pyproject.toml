[project]
name = "ai-data-analyst"
version = "0.1.0"
description = "Autonomous data analyst agent for the Olist e-commerce dataset (SQL, Python, LangGraph)."
readme = "README.md"
authors = [
    { name = "Babar Ali", email = "148423037+Babarali2k21@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.5",
    "fastapi>=0.141.1",
    "langchain>=1.3.14",
    "langchain-openai>=1.4.3",
    "langgraph>=1.2.10",
    "matplotlib>=3.10.0",
    "pandas>=3.0.5",
    "polars>=1.43.2",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.2",
    "uvicorn>=0.52.1",
]

[project.scripts]
ai-data-analyst = "ai_data_analyst:main"
ingest-olist = "ai_data_analyst.data.ingestion.olist:main"
profile-olist = "ai_data_analyst.data.profiling.profiler:main"
ask-sql = "ai_data_analyst.analyst.sql_pipeline:main"
ask-agent = "ai_data_analyst.agent.graph:main"
eval-olist = "ai_data_analyst.evaluation.runner:main"
serve-api = "ai_data_analyst.api.server:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "mypy>=2.3.0",
    "pandas-stubs>=2.3.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.2",
    "types-pyyaml>=6.0.12",
]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["ai_data_analyst"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["duckdb.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["langchain_openai.*", "langchain_core.*", "langgraph.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["matplotlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
